<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#000000"/>
  <title>EXIT PRO Swap</title>
  
  <script src="https://terminal.jup.ag/main.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { backdropBlur: { xs: '2px' } } }
    }
  </script>

  <style>
    body {
      background: linear-gradient(to bottom right, #000, #0f0f1a, #1a0f2e);
      margin: 0; padding: 0;
      height: 100vh; overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass {
      background: rgba(20, 20, 35, 0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
    }
    .glow-green { box-shadow: 0 0 28px rgba(2,192,118,0.4); }

    #integrated-terminal { height: 100%; width: 100%; }

    /* Aggressive hide/ganti Jupiter branding */
    [class*="powered-by"],
    [class*="PoweredBy"],
    [class*="jupiter-branding"],
    [class*="footer"],
    div[contains(text(),'Jupiter')],
    div:where(:has(> span:contains('Jupiter'))),
    .jupiter-terminal-footer,
    [data-testid*="jupiter"],
    img[src*="jup.ag"],
    svg[class*="jupiter-logo"],
    .branding-container,
    footer, .footer-text,
    p[contains(text(),'Powered by Jupiter')],
    [style*="jupiter"] {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      min-height: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Override text jika masih muncul via ::after atau span */
    .jupiter-terminal *::after,
    .jupiter-terminal *::before {
      content: none !important;
    }

    /* Custom branding replacement (opsional: tambah text EXIT PRO di footer terminal jika mau) */
    #integrated-terminal::after {
      content: "EXIT PRO • Powered by Jupiter Aggregator"; /* Ganti jadi ini kalau mau credit tetap ada tapi custom */
      display: block;
      text-align: center;
      font-size: 0.75rem;
      color: #4ade80;
      margin-top: 8px;
      opacity: 0.6;
    }

    @media (max-width: 640px) {
      body { font-size: 14px; }
      nav { padding: 0.75rem 1rem; }
    }
  </style>
</head>
<body class="text-gray-100 flex flex-col min-h-screen">

  <!-- Top Bar dengan logo custom kamu -->
  <nav class="glass fixed top-0 left-0 right-0 z-50 border-b border-gray-800/50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <img 
        src="logo.png"  <!-- GANTI INI: upload logo kamu ke Netlify, misal assets/logo.png atau link full https://... -->
        alt="EXIT PRO" 
        class="h-8 w-8 rounded-full object-cover border border-green-500/30 glow-green"
      />
      <span class="text-lg font-bold tracking-tight text-green-400">EXIT PRO</span>
    </div>
    <button id="connect-btn" class="bg-green-600 hover:bg-green-500 px-4 py-1.5 rounded-full text-sm font-medium transition">
      Connect
    </button>
  </nav>

  <!-- Main: Full terminal -->
  <main class="flex-1 pt-16 px-3 sm:px-5 pb-4 overflow-hidden">
    <div class="glass flex-1 overflow-hidden glow-green h-full">
      <div id="integrated-terminal" class="w-full h-full"></div>
    </div>

    <!-- Small note di bawah (opsional, bisa dihapus) -->
    <div class="mt-3 text-center text-xs text-gray-600">
      Solana DEX • Fast & Secure Swaps
    </div>
  </main>

  <script>
    window.Jupiter.init({
      displayMode: "integrated",
      integratedTargetId: "integrated-terminal",
      endpoint: "https://api.mainnet-beta.solana.com",
      referralAccount: "9HdCWUEgEajC47Hni4YvUFdoCzvncsMscXixMsmhNYmH",
      referralFeeBps: 50,
      theme: 'dark',
      enableReferral: true,
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
      alert('Connect wallet: Phantom / Backpack / Solflare (implementasi wallet adapter nanti)');
    });
  </script>
</body>
</html>
