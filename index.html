<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#000000"/>
  <title>EXIT PRO Swap</title>
  
  <!-- Jupiter Terminal -->
  <script src="https://terminal.jup.ag/main.js"></script>
  
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          backdropBlur: { xs: '2px' }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(to bottom right, #000, #0f0f1a, #1a0f2e);
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass {
      background: rgba(20, 20, 35, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
    }
    .glow-green {
      box-shadow: 0 0 24px rgba(2,192,118,0.35);
    }
    #integrated-terminal {
      min-height: 520px;
    }
    @media (max-width: 640px) {
      #integrated-terminal {
        min-height: 100vh;
      }
    }
  </style>
</head>
<body class="text-gray-100 flex flex-col min-h-screen">

  <!-- Top Bar sederhana -->
  <nav class="glass fixed top-0 left-0 right-0 z-50 border-b border-gray-800/50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <!-- Ganti logo sesuai keinginan -->
      <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center font-bold text-white">E</div>
      <span class="text-lg font-bold tracking-tight">EXIT PRO</span>
    </div>
    <button id="connect-btn" class="bg-green-600 hover:bg-green-500 px-4 py-1.5 rounded-full text-sm font-medium transition">
      Connect
    </button>
  </nav>

  <!-- Main content: hampir full swap terminal -->
  <main class="flex-1 flex flex-col pt-16 px-3 sm:px-5 pb-4 overflow-hidden">
    <!-- Price card kecil di atas (opsional, bisa dihapus kalau mau lebih clean) -->
    <div class="glass p-4 mb-4 glow-green">
      <div class="flex items-baseline justify-between">
        <div>
          <p class="text-3xl sm:text-4xl font-extrabold text-green-400">$0.00004218</p>
          <p class="text-green-400 font-semibold mt-0.5 text-sm sm:text-base">+12.45% (24h)</p>
        </div>
        <div class="text-right text-xs sm:text-sm">
          <p class="text-gray-400">High / Low</p>
          <p>$0.000045 / $0.000038</p>
        </div>
      </div>
    </div>

    <!-- Swap Terminal – ini bagian utama -->
    <div class="glass flex-1 overflow-hidden glow-green">
      <div id="integrated-terminal" class="w-full h-full"></div>
    </div>

    <!-- Info kecil di bawah (opsional) -->
    <div class="mt-4 text-center text-xs text-gray-500">
      Powered by Jupiter • Solana • CA: <span class="font-mono break-all">So111...11112</span>
    </div>
  </main>

  <script>
    // Inisialisasi Jupiter Terminal (integrated mode)
    window.Jupiter.init({
      displayMode: "integrated",
      integratedTargetId: "integrated-terminal",
      endpoint: "https://api.mainnet-beta.solana.com",
      // Ganti referral jika punya
      referralAccount: "9HdCWUEgEajC47Hni4YvUFdoCzvncsMscXixMsmhNYmH",
      referralFeeBps: 50,
      theme: 'dark',
      // Optional: lebih mobile friendly
      enableReferral: true,
      // Bisa tambah default input/output token jika mau
      // defaultInputMint: "So11111111111111111111111111111111111111112",
      // defaultOutputMint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
    });

    // Tombol connect (nanti bisa diganti pake @solana/wallet-adapter)
    document.getElementById('connect-btn').addEventListener('click', () => {
      alert('Connect wallet: Phantom / Backpack / Solflare\n(nanti implementasi wallet adapter di app version)');
    });
  </script>
</body>
</html>
