<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ExitPro Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Chart mock -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0b0e11;
      --panel: #12161c;
      --border: #1f2633;
      --text: #eaecef;
      --muted: #8b949e;
      --green: #00ff9c;
      --red: #ff4d4d;
      --accent: #00b3ff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      height: 60px;
      background: #0e1218;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    .wallet {
      background: var(--panel);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid var(--border);
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr 320px;
      height: calc(100vh - 60px);
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 12px;
    }

    .sidebar h3 {
      font-size: 13px;
      margin-bottom: 10px;
      color: var(--muted);
    }

    .token {
      padding: 10px;
      border-radius: 6px;
      background: #0e1218;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .token:hover {
      background: #161b22;
    }

    .main {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stat {
      background: #0e1218;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .chart {
      flex: 1;
    }

    .trade {
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 12px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      background: #0e1218;
    }

    .tab.buy {
      color: var(--green);
      border: 1px solid var(--green);
    }

    .tab.sell {
      color: var(--red);
      border: 1px solid var(--red);
    }

    input {
      width: 100%;
      padding: 10px;
      background: #0e1218;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .buy-btn {
      background: var(--green);
      color: #000;
    }

    .sell-btn {
      background: var(--red);
      color: #000;
    }
  </style>
</head>
<body>

<header>
  <h1>ExitPro Terminal</h1>
  <div class="wallet">Wallet: Not Connected</div>
</header>

<div class="layout">

  <!-- LEFT -->
  <div class="sidebar">
    <h3>Watchlist</h3>
    <div class="token">SOL / USDC</div>
    <div class="token">BONK</div>
    <div class="token">WIF</div>
    <div class="token">JUP</div>
  </div>

  <!-- CENTER -->
  <div class="main">
    <div class="stats">
      <div class="stat">Price<br><b>$123.45</b></div>
      <div class="stat">Liquidity<br><b>$2.1M</b></div>
      <div class="stat">Volume 24h<br><b>$890K</b></div>
      <div class="stat">MCAP<br><b>$12M</b></div>
    </div>

    <div class="panel chart">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="trade">
    <div class="tabs">
      <div class="tab buy">BUY</div>
      <div class="tab sell">SELL</div>
    </div>

    <input placeholder="Amount (SOL)" />
    <input placeholder="Slippage %" value="1" />

    <button class="buy-btn">ONE CLICK BUY</button>
    <br><br>
    <button class="sell-btn">ONE CLICK SELL</button>
  </div>

</div>

<script>
  const ctx = document.getElementById('chart');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['1','2','3','4','5','6','7'],
      datasets: [{
        data: [10, 12, 11, 14, 13, 15, 16],
        borderColor: '#00ff9c',
        borderWidth: 2,
        tension: 0.3
      }]
    },
    options: {
      plugins: { legend: { display: false }},
      scales: {
        x: { display: false },
        y: { display: false }
      }
    }
  });
</script>

</body>
</html>
