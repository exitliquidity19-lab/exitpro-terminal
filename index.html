<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#000000"/>
  <title>EXIT PRO Swap</title>
  
  <!-- Jupiter Terminal -->
  <script src="https://terminal.jup.ag/main.js"></script>
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          backdropBlur: { xs: '2px' }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(to bottom right, #000, #0f0f1a, #1a0f2e);
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass {
      background: rgba(20, 20, 35, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
    }
    .glow-green {
      box-shadow: 0 0 24px rgba(2,192,118,0.35);
    }
    #integrated-terminal {
      height: 100%;
      width: 100%;
    }

    /* Override Jupiter branding (logo + powered by text) */
    [data-testid="jupiter-logo"],
    [data-testid="powered-by-jupiter"],
    div[class*="PoweredByJupiter"],
    div[class*="JupiterLogo"],
    img[src*="jup.ag"],
    svg[aria-label*="Jupiter"],
    .jupiter-terminal-footer,
    .jupiter-terminal-branding,
    [class*="branding"],
    [class*="powered-by"] {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      opacity: 0 !important;
    }

    /* Hilangkan padding/margin ekstra jika ada */
    #integrated-terminal > div:first-child {
      height: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    @media (max-width: 640px) {
      body { font-size: 14px; }
    }
  </style>
</head>
<body class="text-gray-100 flex flex-col min-h-screen">

  <!-- Top Bar minimal -->
  <nav class="glass fixed top-0 left-0 right-0 z-50 border-b border-gray-800/50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center font-bold text-white">E</div>
      <span class="text-lg font-bold tracking-tight">EXIT PRO</span>
    </div>
    <button id="connect-btn" class="bg-green-600 hover:bg-green-500 px-4 py-1.5 rounded-full text-sm font-medium transition">
      Connect
    </button>
  </nav>

  <!-- Main: Full swap terminal -->
  <main class="flex-1 pt-16 px-3 sm:px-5 pb-4 overflow-hidden">
    <div class="glass flex-1 overflow-hidden glow-green h-full">
      <div id="integrated-terminal" class="w-full h-full"></div>
    </div>

    <!-- Footer kecil opsional -->
    <div class="mt-3 text-center text-xs text-gray-600">
      Solana • Powered by Jupiter Aggregator
    </div>
  </main>

  <script>
    window.Jupiter.init({
      displayMode: "integrated",
      integratedTargetId: "integrated-terminal",
      endpoint: "https://api.mainnet-beta.solana.com",
      referralAccount: "9HdCWUEgEajC47Hni4YvUFdoCzvncsMscXixMsmhNYmH", // ganti jika perlu
      referralFeeBps: 50,
      theme: 'dark',
      enableReferral: true,
      // Optional: default token jika mau preset
      // defaultInputMint: "So11111111111111111111111111111111111111112", // SOL
      // defaultOutputMint: "YOUR_TOKEN_CA_HERE",
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
      alert('Connect wallet: Phantom / Backpack / Solflare\n(Implement @solana/wallet-adapter nanti di app version)');
    });
  </script>
</body>
</html>
