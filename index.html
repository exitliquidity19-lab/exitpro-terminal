<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>EXIT PRO Swap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      background: linear-gradient(to bottom right, #000, #0f0f1a, #1a0f2e); 
      color: #e5e7eb; 
      margin:0; 
      padding:0; 
      height:100vh; 
      overflow:hidden; 
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass { 
      background: rgba(20,20,35,0.8); 
      backdrop-filter: blur(14px); 
      border:1px solid rgba(255,255,255,0.08); 
      border-radius:16px; 
    }
    .glow-green { 
      box-shadow: 0 0 28px rgba(2,192,118,0.4); 
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Top Bar dengan logo yang sesuai file di repo -->
  <nav class="glass fixed top-0 w-full z-50 px-4 py-3 flex justify-between items-center border-b border-gray-800/50">
    <div class="flex items-center gap-3">
      <img 
        src="assets/exit-coin.png" 
        alt="EXIT PRO Logo" 
        class="h-9 w-9 rounded-full object-cover glow-green border border-green-500/30"
        onerror="this.src='https://via.placeholder.com/36/10b981/000?text=EXIT'; this.alt='Fallback Logo';"
      />
      <span class="text-xl font-bold text-green-400">EXIT PRO</span>
    </div>
    <button id="connect-btn" class="bg-green-600 hover:bg-green-500 px-5 py-2 rounded-full font-medium transition">
      Connect Wallet
    </button>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 pt-20 px-4 flex items-center justify-center">
    <div class="glass p-8 w-full max-w-lg glow-green text-center">
      <h1 class="text-3xl font-bold mb-6 text-green-400">Welcome to EXIT PRO Swap</h1>
      <p class="text-lg mb-8">Fast, secure token swaps on Solana. Connect your wallet to start.</p>
      
      <div id="wallet-info" class="text-sm text-gray-400 mb-4 hidden">
        Connected: <span id="pubkey"></span>
      </div>

      <!-- Placeholder untuk swap UI nanti -->
      <div class="space-y-4">
        <input 
          type="text" 
          placeholder="Enter amount" 
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-lg focus:outline-none focus:border-green-500"
        />
        <button 
          class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-lg font-bold text-lg disabled:opacity-50" 
          disabled
        >
          Swap (Coming Soon)
        </button>
      </div>
    </div>
  </main>

  <script>
    const connectBtn = document.getElementById('connect-btn');
    const walletInfo = document.getElementById('wallet-info');
    const pubkeySpan = document.getElementById('pubkey');

    connectBtn.addEventListener('click', async () => {
      if (window.solana && window.solana.isPhantom) {
        try {
          const response = await window.solana.connect({ onlyIfTrusted: false });
          const publicKey = response.publicKey.toString();
          
          pubkeySpan.textContent = `\( {publicKey.slice(0,6)}... \){publicKey.slice(-6)}`;
          walletInfo.classList.remove('hidden');
          connectBtn.textContent = 'Connected';
          connectBtn.disabled = true;
          connectBtn.classList.add('opacity-70', 'cursor-default');

          alert(`Connected to Phantom! Public Key: ${publicKey}`);
        } catch (err) {
          console.error(err);
          alert('Connection failed: ' + (err.message || 'Unknown error'));
        }
      } else {
        alert('Phantom wallet not detected!\nPlease install Phantom: https://phantom.app/');
      }
    });

    // Auto-connect jika sudah trusted (opsional)
    window.addEventListener('load', async () => {
      if (window.solana && window.solana.isPhantom) {
        try {
          await window.solana.connect({ onlyIfTrusted: true });
          const publicKey = window.solana.publicKey.toString();
          pubkeySpan.textContent = `\( {publicKey.slice(0,6)}... \){publicKey.slice(-6)}`;
          walletInfo.classList.remove('hidden');
          connectBtn.textContent = 'Connected (Trusted)';
          connectBtn.disabled = true;
        } catch (err) {
          // silent fail
        }
      }
    });
  </script>
</body>
</html>
