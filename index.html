<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NeonDEX Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

  <!-- Futuristic Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Orbitron', monospace;
      background: #000;
    }
    .neon {
      box-shadow: 0 0 10px #39FF14;
    }
    .neon-purple {
      box-shadow: 0 0 10px #8A2BE2;
    }
    .glitch:hover {
      text-shadow: 2px 0 #39FF14, -2px 0 #8A2BE2;
    }
  </style>
</head>

<body class="text-green-400">

<!-- HEADER -->
<header class="flex items-center justify-between px-6 py-4 border-b border-green-500 neon">
  <h1 class="text-2xl font-bold glitch">NeonDEX</h1>

  <input
    placeholder="Search Token Contract Address"
    class="w-1/2 bg-black border border-purple-600 px-4 py-2 rounded neon-purple text-sm"
  />

  <button class="bg-green-500 text-black px-4 py-2 rounded neon hover:opacity-80">
    Connect Wallet
  </button>
</header>

<!-- MAIN GRID -->
<div class="grid grid-cols-12 gap-4 p-4">

  <!-- LEFT SIDEBAR -->
  <aside class="col-span-12 md:col-span-2 border border-green-500 rounded p-3 neon">
    <h2 class="mb-3 font-semibold glitch">🔥 Trending</h2>
    <ul class="space-y-2 text-sm">
      <li class="flex justify-between hover:text-purple-400">
        <span>ETH</span><span>+3.2%</span>
      </li>
      <li class="flex justify-between hover:text-purple-400">
        <span>PEPE</span><span>+12.4%</span>
      </li>
      <li class="flex justify-between hover:text-purple-400">
        <span>SOL</span><span>-1.1%</span>
      </li>
      <li class="flex justify-between hover:text-purple-400">
        <span>ARB</span><span>+5.9%</span>
      </li>
    </ul>
  </aside>

  <!-- CHART -->
  <main class="col-span-12 md:col-span-7 border border-green-500 rounded neon">
    <div id="chart" class="h-[420px]"></div>
  </main>

  <!-- SWAP -->
  <aside class="col-span-12 md:col-span-3 border border-purple-600 rounded p-4 neon-purple">
    <h2 class="mb-4 font-semibold glitch">Swap</h2>

    <div class="space-y-3">
      <input placeholder="From (ETH)" class="w-full bg-black border px-3 py-2 rounded" />
      <input placeholder="To (Token)" class="w-full bg-black border px-3 py-2 rounded" />

      <div class="flex justify-between text-xs">
        <span>Slippage</span>
        <span>0.5%</span>
      </div>

      <input type="range" min="0" max="5" value="1" />

      <div class="text-xs opacity-70">⛽ Gas Estimate: ~0.003 ETH</div>

      <button class="w-full bg-green-500 text-black py-2 rounded neon hover:opacity-80">
        Execute Swap
      </button>
    </div>
  </aside>
</div>

<!-- TRANSACTIONS -->
<section class="p-4">
  <div class="border border-green-500 rounded neon p-4">
    <h2 class="mb-3 glitch">📜 Live Transactions</h2>

    <table class="w-full text-sm">
      <thead class="border-b border-green-500">
        <tr>
          <th class="text-left">Time</th>
          <th>Type</th>
          <th>Price</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody class="opacity-90">
        <tr>
          <td>12:01:22</td>
          <td class="text-green-400">Buy</td>
          <td>$2,410</td>
          <td>1.2 ETH</td>
        </tr>
        <tr>
          <td>12:01:09</td>
          <td class="text-red-400">Sell</td>
          <td>$2,398</td>
          <td>0.5 ETH</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<!-- CHART SCRIPT -->
<script>
  const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: {
      background: { color: '#000000' },
      textColor: '#39FF14',
    },
    grid: {
      vertLines: { color: '#222' },
      horzLines: { color: '#222' },
    },
    width: document.getElementById('chart').clientWidth,
    height: 420,
  });

  const series = chart.addCandlestickSeries({
    upColor: '#39FF14',
    downColor: '#8A2BE2',
    borderVisible: false,
    wickUpColor: '#39FF14',
    wickDownColor: '#8A2BE2',
  });

  series.setData([
    { time: '2025-02-01', open: 2200, high: 2300, low: 2150, close: 2250 },
    { time: '2025-02-02', open: 2250, high: 2400, low: 2230, close: 2350 },
    { time: '2025-02-03', open: 2350, high: 2450, low: 2300, close: 2400 },
    { time: '2025-02-04', open: 2400, high: 2480, low: 2380, close: 2410 },
  ]);

  window.addEventListener('resize', () => {
    chart.applyOptions({ width: document.getElementById('chart').clientWidth });
  });
</script>

</body>
    </html>
